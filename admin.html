<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connector Database &amp; Shop Tooling Manager</title>
    <link rel="stylesheet" href="styles.css?v=1.3.0">
    <link rel="stylesheet" href="admin.css?v=1.3.0">
    <script src="data/fallbackData.js?v=1.3.0"></script>
    <script src="js/services/dataService.js?v=1.3.0"></script>
    <script src="js/admin.js?v=1.3.0" defer></script>
</head>
<body>

<div class="header-toolbar">
    <div class="title-container">
        <h1 style="margin: 0; color: var(--heading-color); font-size: 1.5rem;">Connector Database &amp; Shop Tooling Manager</h1>
        <span class="admin-header-badge unlocked">● Local Admin Active</span>
    </div>
    
    <div class="admin-toolbar-actions">
        <a href="index.html" class="admin-quick-nav" title="Return to Configurator">
            <svg style="width: 14px; height: 14px; fill: currentColor;" viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            Configurator Tool
        </a>

        <button class="theme-toggle-btn" id="themeToggleBtn" aria-label="Toggle Theme" title="Toggle Light/Dark Mode">
            <svg class="sun-icon" viewBox="0 0 24 24">
                <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03 1.41 1.06-1.06z"/>
            </svg>
            <svg class="moon-icon" viewBox="0 0 24 24">
                <path d="M12.3 2a10 10 0 0 0-1.9 20 10 10 0 0 0 9.6-7 1 1 0 0 0-1.2-1.2 8.01 8.01 0 1 1-6.5-11.8 1 1 0 0 0-.01-2z"/>
            </svg>
        </button>
    </div>
</div>

<!-- Admin Tab Switcher -->
<div class="tab-container" style="margin-bottom: 20px;">
    <button type="button" class="tab-btn active" data-tab="tooling">
        <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24"><path d="M22.7 19l-9.1-9.1c.9-2.3.4-5-1.5-6.9-2-2-5-2.4-7.4-1.3L9 6 6 9 1.6 4.7C.4 7.1.9 10.1 2.9 12.1c1.9 1.9 4.6 2.4 6.9 1.5l9.1 9.1c.4.4 1 .4 1.4 0l2.3-2.3c.5-.4.5-1.1.1-1.4z"/></svg>
        Shop Tooling Inventory
    </button>
    <button type="button" class="tab-btn" data-tab="layouts">
        <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24"><path d="M3 3v18h18V3H3zm16 16H5V5h14v14zM11 7h2v10h-2V7zm-4 4h2v6H7v-6zm8-2h2v8h-2V9z"/></svg>
        Insert Arrangements
    </button>
    <button type="button" class="tab-btn" data-tab="contacts">
        <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24"><path d="M7 2v11h3v9l7-12h-4l4-8z"/></svg>
        Contacts &amp; Ratings
    </button>
    <button type="button" class="tab-btn" data-tab="finishes">
        <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L4.35 19.4c-.39.39-.39 1.02 0 1.41.39.39 1.02.39 1.41 0l1.9-1.9C9.22 19.59 10.57 20 12 20c4.97 0 9-4.03 9-9s-4.03-9-9-9zm0 15c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z"/></svg>
        Finishes &amp; Shells
    </button>
    <button type="button" class="tab-btn" data-tab="export">
        <svg style="width: 16px; height: 16px; fill: currentColor;" viewBox="0 0 24 24"><path d="M19 12v7H5v-7H3v7c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-7h-2zm-6 .67l2.59-2.58L17 11.5l-5 5-5-5 1.41-1.41L11 12.67V3h2v9.67z"/></svg>
        Data Export &amp; Audit
    </button>
</div>

<!-- Tab Content Mounting Node -->
<div id="tabContentContainer"></div>

<!-- Modal: Add / Edit Tool -->
<div id="toolModal" class="admin-modal-overlay">
    <div class="admin-modal-card">
        <div class="admin-modal-header">
            <h3 id="toolModalTitle">Add Shop Tool</h3>
            <button type="button" class="admin-modal-close" aria-label="Close">&times;</button>
        </div>
        <form id="toolForm" onsubmit="event.preventDefault(); saveToolModal();">
            <input type="hidden" id="toolFormEditIndex" value="-1">
            <div class="admin-form-group">
                <label for="toolFormCategory">Tool Category</label>
                <select id="toolFormCategory">
                    <option value="positioners">Positioner / Turret Head</option>
                    <option value="frames">Crimp Tool Frame</option>
                </select>
            </div>
            <div class="admin-form-group">
                <label for="toolFormId">Tool ID / Shop Code (e.g. K42, AFM8, K1584)</label>
                <input type="text" id="toolFormId" required placeholder="e.g. K42 or AFM8">
            </div>
            <div class="admin-form-group">
                <label for="toolFormMilSpec">Mil-Spec / Manufacturer P/N</label>
                <input type="text" id="toolFormMilSpec" placeholder="e.g. M22520/2-09">
            </div>
            <div class="admin-form-group">
                <label for="toolFormName">Description &amp; Contact Compatibility</label>
                <input type="text" id="toolFormName" required placeholder="e.g. K42 Positioner (Size 22D Pin)">
            </div>
            <div class="admin-form-group">
                <label for="toolFormStatus">Availability Status</label>
                <select id="toolFormStatus">
                    <option value="In Shop">In Shop (Available)</option>
                    <option value="Calibrated">Calibrated (Verified)</option>
                    <option value="Out for Calibration">Out for Calibration</option>
                    <option value="Missing / On Order">Missing / On Order</option>
                </select>
            </div>
            <div class="admin-form-actions">
                <button type="button" class="btn-outline btn-modal-cancel" style="width: auto; padding: 7px 16px;">Cancel</button>
                <button type="submit" class="btn-primary" style="width: auto; padding: 7px 20px;">Save Tool</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Add / Edit Layout -->
<div id="layoutModal" class="admin-modal-overlay">
    <div class="admin-modal-card">
        <div class="admin-modal-header">
            <h3 id="layoutModalTitle">Add Insert Arrangement</h3>
            <button type="button" class="admin-modal-close" aria-label="Close">&times;</button>
        </div>
        <form id="layoutForm" onsubmit="event.preventDefault(); saveLayoutModal();">
            <input type="hidden" id="layoutFormEditIndex" value="-1">
            <div class="admin-form-group">
                <label for="layoutFormSeries">Connector Series</label>
                <select id="layoutFormSeries">
                    <option value="d38999">MIL-DTL-38999 / Commercial Tri-Start</option>
                    <option value="deutsch_asl">Deutsch AutoSport ASL Series</option>
                </select>
            </div>
            <div class="admin-form-group">
                <label for="layoutFormShell">Shell Size (e.g. 11, 15, 06, 07)</label>
                <input type="text" id="layoutFormShell" required placeholder="e.g. 11 or 06">
            </div>
            <div class="admin-form-group">
                <label for="layoutFormLetter">Shell Letter Code (A-J for D38999, or leave blank for ASL)</label>
                <input type="text" id="layoutFormLetter" placeholder="e.g. B">
            </div>
            <div class="admin-form-group">
                <label for="layoutFormArrangement">Arrangement Code (e.g. 11-35, 06-05)</label>
                <input type="text" id="layoutFormArrangement" required placeholder="e.g. 11-35 or 06-05">
            </div>
            <div class="admin-form-group">
                <label for="layoutFormCounts">Cavity Breakdown JSON (e.g. {"22D": 13} or {"24": 5})</label>
                <input type="text" id="layoutFormCounts" required placeholder='{"22D": 13}'>
                <small style="opacity: 0.8; font-size: 0.75rem;">Total contact count will automatically determine pin sequence 1..N.</small>
            </div>
            <div class="admin-form-actions">
                <button type="button" class="btn-outline btn-modal-cancel" style="width: auto; padding: 7px 16px;">Cancel</button>
                <button type="submit" class="btn-primary" style="width: auto; padding: 7px 20px;">Save Arrangement</button>
            </div>
        </form>
    </div>
</div>

<!-- Modal: Edit Insertion / Extraction Tool -->
<div id="removalToolModal" class="admin-modal-overlay">
    <div class="admin-modal-card">
        <div class="admin-modal-header">
            <h3 id="removalToolModalTitle">Edit Insertion / Extraction Tool</h3>
            <button type="button" class="admin-modal-close" aria-label="Close">&times;</button>
        </div>
        <form id="removalToolForm" onsubmit="event.preventDefault(); saveRemovalToolModal();">
            <input type="hidden" id="removalToolFormKey" value="">
            <div class="admin-form-group">
                <label for="removalToolFormSize">Contact Size</label>
                <input type="text" id="removalToolFormSize" required readonly style="opacity: 0.8; cursor: not-allowed;">
            </div>
            <div class="admin-form-group">
                <label for="removalToolFormPN">Part Number</label>
                <input type="text" id="removalToolFormPN" required placeholder="e.g. M81969/14-01">
            </div>
            <div class="admin-form-group">
                <label for="removalToolFormColors">Color Band / Identification</label>
                <input type="text" id="removalToolFormColors" required placeholder="e.g. Green / White">
            </div>
            <div class="admin-form-group">
                <label for="removalToolFormDesc">Description</label>
                <input type="text" id="removalToolFormDesc" required placeholder="e.g. Plastic Insertion/Extraction (Size 22D)">
            </div>
            <div class="admin-form-group">
                <label for="removalToolFormStatus">Availability Status</label>
                <select id="removalToolFormStatus">
                    <option value="In Shop">In Shop (Available)</option>
                    <option value="Calibrated">Calibrated (Verified)</option>
                    <option value="Out for Calibration">Out for Calibration</option>
                    <option value="Missing / On Order">Missing / On Order</option>
                </select>
            </div>
            <div class="admin-form-actions">
                <button type="button" class="btn-outline btn-modal-cancel" style="width: auto; padding: 7px 16px;">Cancel</button>
                <button type="submit" class="btn-primary" style="width: auto; padding: 7px 20px;">Save Tool</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
